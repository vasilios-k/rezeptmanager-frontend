name: Frontend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint checks
        run: |
          npx oxlint .
          npx eslint .

      - name: Run frontend tests
        run: npm run test:unit -- --run

      - name: Build frontend
        run: npm run build